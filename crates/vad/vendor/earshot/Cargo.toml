# Source: pykeio/earshot, earshot@0.1.0 (BSD-3-Clause).
# Local patch: GMM standard deviations are floored at MIN_STD, as in the WebRTC reference, instead of capped;
# the peak-amplitude scan saturates i16::MIN like WebRtcSpl_MaxAbsValueW16; the all-pass filter wraps on
# clipped input like the reference's int32 arithmetic instead of panicking in debug builds.

[package]
edition = "2021"
name = "earshot"
version = "0.1.0"
authors = ["Carson M <carson@pyke.io>"]
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Ridiculously fast voice activity detection in pure #[no_std] Rust"
license = "BSD-3-Clause"
repository = "https://github.com/pykeio/earshot"

[lib]
name = "earshot"
path = "src/lib.rs"

[features]
alloc = []
default = [
    "std",
    "alloc",
]
std = []
