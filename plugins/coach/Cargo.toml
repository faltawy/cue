[package]
name = "tauri-plugin-coach"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/js", "/node_modules"]
links = "tauri-plugin-coach"
description = "Meeting coach: a floating window backed by a local Claude Code session"

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
anlg-db-app = { workspace = true }
anlg-transcript = { workspace = true }
anlg-tiptap = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
tauri = { workspace = true }
tauri-plugin-db = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-store2 = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = ["NSWindow", "NSResponder"] }

[dev-dependencies]
anlg-db-core = { workspace = true }
specta-typescript = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
