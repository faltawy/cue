name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.2.0)
        required: true
        type: string
      runner:
        description: macOS runner image (macos-15 has more capacity and builds with its Xcode 26)
        required: true
        type: choice
        options: [macos-15, macos-26]
        default: macos-15

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASES_REPO: faltawy/cue

jobs:
  release:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the releases repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The workflow token is missing."
            exit 1
          fi
          if ! gh api "repos/$RELEASES_REPO" --silent; then
            echo "::error::The workflow token can't reach $RELEASES_REPO."
            exit 1
          fi
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>"$RUNNER_TEMP/release-view.err"; then
            echo "::error::Release $TAG already exists in $RELEASES_REPO; delete it first to rebuild."
            exit 1
          fi
          if ! grep -q "release not found" "$RUNNER_TEMP/release-view.err"; then
            cat "$RUNNER_TEMP/release-view.err"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          submodules: recursive
          fetch-depth: 0

      - name: Read the release notes
        run: |
          if ! node scripts/release-notes.mjs release "$TAG" > "$RUNNER_TEMP/notes.md"; then
            echo "::error::No release notes for $TAG. Run pnpm release:version, commit, then tag (docs/RELEASING.md)."
            exit 1
          fi

      - name: Use Xcode 26
        run: |
          major=$(xcodebuild -version | awk 'NR == 1 { split($2, version, "."); print version[1] }')
          if [ "$major" -lt 26 ]; then
            xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
            if [ -z "$xcode" ]; then
              echo "::error::This runner has no Xcode 26; the app needs the macOS 26 SDK."
              exit 1
            fi
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          xcodebuild -version

      - uses: ./.github/actions/pnpm_install
      - uses: ./.github/actions/install_desktop_deps
      - uses: ./.github/actions/rust_install
      - uses: ./.github/actions/bun_install

      - name: Stamp the version
        run: echo "VERSION=$(node scripts/release-version.mjs "$TAG")" >> "$GITHUB_ENV"

      - name: Build the coach sidecar
        working-directory: apps/coach
        run: bun run build:sidecar

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/cue-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identity=$(security find-identity -p codesigning "$keychain" | awk -F'"' '/\)/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::No code-signing identity in APPLE_CERTIFICATE."
            exit 1
          fi
          echo "Signing as: $identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Enable notarization when Apple credentials exist
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              echo "NOTARIZE=true"
            } >> "$GITHUB_ENV"
          else
            echo "No Apple ID credentials; skipping notarization."
          fi

      - run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Build Cue
        working-directory: apps/desktop
        env:
          LIBONNXRUNTIME_NO_PKG_CONFIG: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm exec tauri build \
            --target aarch64-apple-darwin \
            --bundles app,dmg \
            --config src-tauri/tauri.conf.stable.json \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - if: always()
        run: '"$SCCACHE_PATH" --show-stats'

      - name: Collect artifacts
        run: |
          bundle="apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          app="$bundle/macos/Cue.app"
          dmg=$(ls "$bundle"/dmg/*.dmg)
          mkdir -p dist
          hdiutil convert "$dmg" -format ULMO -o "dist/Cue_${VERSION}_aarch64.dmg"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "dist/Cue_${VERSION}_aarch64.dmg"
          cp "$bundle/macos/Cue.app.tar.gz" "dist/Cue_${VERSION}_aarch64.app.tar.gz"
          cp "$bundle/macos/Cue.app.tar.gz.sig" "dist/Cue_${VERSION}_aarch64.app.tar.gz.sig"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Verify the bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -F "Authority=$APPLE_SIGNING_IDENTITY"
          if find "$APP/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) -exec otool -L {} + 2>/dev/null | grep -F /opt/homebrew; then
            echo "::error::The bundle links against Homebrew libraries."
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --strict --verbose=2 "dist/Cue_${VERSION}_aarch64.dmg"
          hdiutil verify "dist/Cue_${VERSION}_aarch64.dmg"

      - name: Verify the updater signature
        run: |
          brew install minisign
          node -e 'const c=require("./apps/desktop/src-tauri/tauri.conf.json"); process.stdout.write(c.plugins.updater.pubkey)' \
            | base64 --decode > "$RUNNER_TEMP/updater.pub"
          base64 --decode < "dist/Cue_${VERSION}_aarch64.app.tar.gz.sig" > "$RUNNER_TEMP/updater.minisig"
          minisign -V -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/updater.minisig" \
            -m "dist/Cue_${VERSION}_aarch64.app.tar.gz"

      - name: Notarize the DMG
        if: env.NOTARIZE == 'true'
        run: |
          node scripts/notarize-dmg.mjs "dist/Cue_${VERSION}_aarch64.dmg"
          xcrun stapler staple "dist/Cue_${VERSION}_aarch64.dmg"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi

          tarball="Cue_${VERSION}_aarch64.app.tar.gz"
          node scripts/release-manifest.mjs \
            --version "$VERSION" \
            --signature-file "dist/$tarball.sig" \
            --repo "$RELEASES_REPO" \
            --tag "$TAG" \
            --asset "$tarball" \
            --notes-file "$RUNNER_TEMP/notes.md" > dist/latest.json
          cat dist/latest.json

          gh release create "$TAG" --repo "$RELEASES_REPO" --verify-tag --draft \
            --title "Cue $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}" \
            "dist/Cue_${VERSION}_aarch64.dmg" \
            "dist/$tarball" \
            "dist/$tarball.sig" \
            dist/latest.json
          gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false

          url=$(node -p 'require("./dist/latest.json").platforms["darwin-aarch64"].url')
          if ! curl -fsSL -o /dev/null "$url"; then
            echo "::error::The published update isn't downloadable at $url."
            exit 1
          fi

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN"; fi
