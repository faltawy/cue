on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/pnpm_install
      - run: pnpm -F ui build
      - run: pnpm -F desktop typecheck
      - run: pnpm -F desktop test
      - run: pnpm -F desktop i18n:check
      - run: node --test scripts/*.test.mjs
      - run: pnpm lint:oxlint

  coach:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/coach
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun_install
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:sidecar

  macos:
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/pnpm_install
      - uses: ./.github/actions/install_desktop_deps
      - uses: ./.github/actions/rust_install
      - run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
      - run: cargo check --locked -p desktop --features dev
      - run: cargo test --locked -p tauri-plugin-coach
      - run: cargo test --locked -p cloudsync
      - run: "cargo test --locked -p db-core 'cloudsync::' -- --test-threads=1"
      - run: |
          git diff --exit-code -- \
            plugins/db/js/bindings.gen.ts \
            plugins/db/permissions/autogenerated \
            plugins/db/permissions/schemas/schema.json

  ci:
    if: always()
    needs: [js, coach, macos]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
