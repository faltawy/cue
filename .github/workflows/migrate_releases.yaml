name: Migrate historical releases

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: migrate-historical-releases
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import subprocess,json,pathlib,hashlib
          base=pathlib.Path('/tmp/cue-release-migration'); base.mkdir(exist_ok=True)
          def gh(*args): return subprocess.check_output(['gh',*args],text=True)
          releases=json.loads(gh('api','repos/faltawy/cue-releases/releases'))
          for r in reversed(releases):
           tag=r['tag_name']; d=base/tag; d.mkdir(exist_ok=True)
           subprocess.run(['git','rev-parse','--verify','refs/tags/'+tag],check=True,stdout=subprocess.DEVNULL)
           existing=json.loads(gh('api','repos/faltawy/cue/releases'))
           if any(x['tag_name']==tag for x in existing):
            print('Already present:',tag,flush=True); continue
           print('Downloading',tag,flush=True)
           subprocess.run(['gh','release','download',tag,'-R','faltawy/cue-releases','--dir',str(d),'--clobber'],check=True)
           for a in r['assets']:
            p=d/a['name']; digest='sha256:'+hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
            assert p.stat().st_size==a['size'] and digest==a['digest'],a['name']
           manifest=d/'latest.json'
           if manifest.exists():
            m=json.loads(manifest.read_text())
            for platform in m['platforms'].values(): platform['url']=platform['url'].replace('/faltawy/cue-releases/','/faltawy/cue/')
            manifest.write_text(json.dumps(m,indent=2)+'\n')
           notes=d/'notes.md'; notes.write_text(r['body'] or '')
           args=['gh','release','create',tag,'-R','faltawy/cue','--verify-tag','--draft','--title',r['name'],'--notes-file',str(notes)]
           if r['prerelease']:args.append('--prerelease')
           args.extend(str(d/a['name']) for a in r['assets'])
           subprocess.run(args,check=True)
           target=json.loads(gh('api','repos/faltawy/cue/releases'))
           dest=next(x for x in target if x['tag_name']==tag)
           for a in dest['assets']:
            assert a['digest']=='sha256:'+hashlib.file_digest((d/a['name']).open('rb'),'sha256').hexdigest(),a['name']
           versions=[tuple(map(int,x['tag_name'].lstrip('v').split('.'))) for x in target if not x['prerelease'] and not x['draft']]
           current=tuple(map(int,tag.lstrip('v').split('.')))
           latest=not r['prerelease'] and (not versions or current>max(versions))
           subprocess.run(['gh','release','edit',tag,'-R','faltawy/cue','--draft=false','--latest='+str(latest).lower()],check=True)
           print('Published and verified',tag,flush=True)
