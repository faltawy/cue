<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cue</title>
    <script src="/theme-boot.js"></script>
    <style>
      html, body, #root {
        background: transparent !important;
        background-color: transparent !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(0.98 0 0);
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body:has(#root:not(:empty)) #boot-splash {
        display: none;
      }
      html.dark #boot-splash {
        background: oklch(0.2 0 0);
      }
      .boot-splash-mark {
        position: relative;
        width: 3rem;
      }
      .boot-splash-mark svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .boot-splash-base {
        color: oklch(0.02 0 0 / 0.2);
      }
      html.dark .boot-splash-base {
        color: oklch(0.95 0 0 / 0.2);
      }
      .boot-splash-highlight {
        position: absolute;
        inset: 0;
        color: oklch(0.02 0 0 / 0.75);
        -webkit-mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        -webkit-mask-size: 220% 100%;
        mask-size: 220% 100%;
        animation: boot-splash-shimmer 2.4s ease-in-out infinite;
      }
      html.dark .boot-splash-highlight {
        color: oklch(0.95 0 0 / 0.5);
      }
      .boot-splash-detail {
        max-width: 16rem;
        margin: 1.25rem 0 0;
        color: oklch(0.45 0 0);
        font-family:
          "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 0.75rem;
        line-height: 1rem;
        text-align: center;
        opacity: 0;
        animation: boot-splash-detail-reveal 0s linear 2s forwards;
      }
      html.dark .boot-splash-detail {
        color: oklch(0.55 0 0);
      }
      @keyframes boot-splash-shimmer {
        0% {
          -webkit-mask-position: 120% 0%;
          mask-position: 120% 0%;
        }
        100% {
          -webkit-mask-position: -20% 0%;
          mask-position: -20% 0%;
        }
      }
      @keyframes boot-splash-detail-reveal {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-highlight {
          animation: none;
          opacity: 0;
        }
      }
    </style>
    <script src="/relay-shim.js"></script>
  </head>
  <body spellcheck="false">
    <div id="boot-splash" data-tauri-drag-region aria-hidden="true">
      <div class="boot-splash-content">
        <div class="boot-splash-mark">
          <svg
            class="boot-splash-base"
            viewBox="1.8 3.9 20.4 16.2"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M14.567 16.667A6.6 6.6 0 1 1 14.567 7.333"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />
            <circle cx="19.9" cy="12" r="2.3" />
          </svg>
          <div class="boot-splash-highlight" aria-hidden="true">
            <svg viewBox="1.8 3.9 20.4 16.2" fill="currentColor">
              <path
                d="M14.567 16.667A6.6 6.6 0 1 1 14.567 7.333"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
              />
              <circle cx="19.9" cy="12" r="2.3" />
            </svg>
          </div>
        </div>
        <p class="boot-splash-detail">
          Loading Cue. This is taking longer than expected.
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
